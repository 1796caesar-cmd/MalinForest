name: Build and release MalinForest
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: malinforest-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MALINFOREST_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/malinforest-release.jks"
      - name: Determine next version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name')
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          version=$(printf '%s\n%s\n' "$tags" "$releases" | python3 -c 'import sys,re; versions=[39]; versions.extend(int(m[1])*10+int(m[2]) for line in sys.stdin if (m:=re.fullmatch(r"v?([0-9]+)\.([0-9])",line.strip()))); n=max(versions)+1; print(f"{n//10}.{n%10}")')
          echo "MALINFOREST_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "Next version: $version"
      - name: Build release APK
        env:
          MALINFOREST_KEYSTORE_PATH: ${{ runner.temp }}/malinforest-release.jks
          MALINFOREST_STORE_PASSWORD: ${{ secrets.MALINFOREST_STORE_PASSWORD }}
          MALINFOREST_KEY_ALIAS: ${{ secrets.MALINFOREST_KEY_ALIAS }}
          MALINFOREST_KEY_PASSWORD: ${{ secrets.MALINFOREST_KEY_PASSWORD }}
          MALINFOREST_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MalinForest-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish release with exact two-part version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} != 1 )); then echo 'Expected exactly one APK' >&2; exit 1; fi
          apk="${apks[0]}"
          filename="$(basename "$apk")"
          if [[ ! "$filename" =~ ^MalinForest-([0-9]+\.[0-9])\.apk$ ]]; then
            echo "Incorrect APK version format: $filename" >&2; exit 1
          fi
          version="${BASH_REMATCH[1]}"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite" >&2
            exit 1
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" \
              --title "MalinForest $version" \
              --notes "MalinForest $version" --latest
          fi
