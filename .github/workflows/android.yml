name: Build and release MalinForest
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MALINFOREST_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/malinforest-release.jks"
      - name: Build release APK
        env:
          MALINFOREST_KEYSTORE_PATH: ${{ runner.temp }}/malinforest-release.jks
          MALINFOREST_STORE_PASSWORD: ${{ secrets.MALINFOREST_STORE_PASSWORD }}
          MALINFOREST_KEY_ALIAS: ${{ secrets.MALINFOREST_KEY_ALIAS }}
          MALINFOREST_KEY_PASSWORD: ${{ secrets.MALINFOREST_KEY_PASSWORD }}
          MALINFOREST_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MalinForest-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish release with exact two-part version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} != 1 )); then echo 'Expected exactly one APK' >&2; exit 1; fi
          apk="${apks[0]}"
          filename="$(basename "$apk")"
          if [[ ! "$filename" =~ ^MalinForest-([0-9]+\.[0-9])\.apk$ ]]; then
            echo "Incorrect APK version format: $filename" >&2; exit 1
          fi
          version="${BASH_REMATCH[1]}"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" \
              --title "MalinForest $version" \
              --notes "MalinForest $version" --latest
          fi
