
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MALINFOREST_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/malinforest-release.jks"

      - name: Build signed Release APK
        env:
          MALINFOREST_KEYSTORE_PATH: ${{ runner.temp }}/malinforest-release.jks
          MALINFOREST_STORE_PASSWORD: ${{ secrets.MALINFOREST_STORE_PASSWORD }}
          MALINFOREST_KEY_ALIAS: ${{ secrets.MALINFOREST_KEY_ALIAS }}
          MALINFOREST_KEY_PASSWORD: ${{ secrets.MALINFOREST_KEY_PASSWORD }}
          MALINFOREST_VERSION_CODE: ${{ github.run_number }}
          MALINFOREST_VERSION_NAME: '1.6'
        run: |
          gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MalinForest-signed-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish or update GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one APK, found ${#apks[@]}" >&2
            exit 1
          fi
          apk="${apks[0]}"
          filename="$(basename "$apk")"
          if [[ ! "$filename" =~ ^MalinForest-v([0-9]+\.[0-9]+(\.[0-9]+)*)\.apk$ ]]; then
            echo "Unexpected APK filename: $filename" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" \
              --title "MalinForest $tag" \
              --notes "Автоматичний реліз MalinForest $tag" \
              --latest
          fi
