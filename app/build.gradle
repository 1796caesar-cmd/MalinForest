
plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.malinapk.kiosk'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.malinapk.kiosk'
        minSdk 23
        targetSdk 28

        versionCode (System.getenv('MALINFOREST_VERSION_CODE') ?: '1').toInteger()
        versionName "1.0.${System.getenv('MALINFOREST_VERSION_CODE') ?: '1'}"
    }

    signingConfigs {
        release {
            def keyPath = System.getenv('MALINFOREST_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('MALINFOREST_STORE_PASSWORD')
                keyAlias System.getenv('MALINFOREST_KEY_ALIAS')
                keyPassword System.getenv('MALINFOREST_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
