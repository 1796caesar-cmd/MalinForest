plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.malinapk.kiosk'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.malinapk.kiosk'
        minSdk 23
        targetSdk 28

        // Номер збірки збільшується автоматично в GitHub Actions.
        versionCode = Integer.parseInt(System.getenv('MALINFOREST_VERSION_CODE') ?: '1')
        // Версію для користувача змінюємо при випуску наступної версії.
        versionName = System.getenv('MALINFOREST_VERSION_NAME') ?: '1.5'
    }

    signingConfigs {
        release {
            def keyPath = System.getenv('MALINFOREST_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('MALINFOREST_STORE_PASSWORD')
                keyAlias System.getenv('MALINFOREST_KEY_ALIAS')
                keyPassword System.getenv('MALINFOREST_KEY_PASSWORD')
            }
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "MalinForest-v${variant.versionName}.apk"
        }
    }
}
