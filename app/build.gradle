
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MALINFOREST_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/malinforest-release.jks"

      - name: Build signed Release APK
        env:
          MALINFOREST_KEYSTORE_PATH: ${{ runner.temp }}/malinforest-release.jks
          MALINFOREST_STORE_PASSWORD: ${{ secrets.MALINFOREST_STORE_PASSWORD }}
          MALINFOREST_KEY_ALIAS: ${{ secrets.MALINFOREST_KEY_ALIAS }}
          MALINFOREST_KEY_PASSWORD: ${{ secrets.MALINFOREST_KEY_PASSWORD }}
          MALINFOREST_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MalinForest-signed-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
